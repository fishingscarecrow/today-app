<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18181b">
    <title>Today — Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5f5f7;
            color: #18181b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(420px, 100%);
            padding: 24px;
            border: 1px solid #e4e4e7;
            border-radius: 20px;
            background: white;
            box-shadow: 0 18px 55px rgba(0,0,0,0.08);
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0; color: #71717a; line-height: 1.5; font-size: 14px; }
        button {
            margin-top: 18px;
            min-height: 42px;
            padding: 0 14px;
            border: 0;
            border-radius: 11px;
            background: #18181b;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Today is offline</h1>
        <p>Your saved planner data stays on this device. Reconnect and try opening Today again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
